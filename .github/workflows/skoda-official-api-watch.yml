name: Škoda official-API app watch

# Polls the MyŠkoda app version every 4 hours. The official Škoda public API
# (public.api.connect.skoda-auto.cz) is live, but the X-API-Key can only be
# minted from Settings → Smart Home → API Keys, which ships with app v8.16
# (absent from 8.15.0). When the mirrors reach v8.16 this opens a tracking issue
# so we can pull the APK first, androguard the key-creation endpoint, and
# evaluate automatic key-minting for the opt-in Škoda-official channel.

on:
  schedule:
    - cron: "0 */4 * * *"   # every 4 hours
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check MyŠkoda app version
        id: check
        run: |
          out="$(python scripts/skoda_official_watch.py)"
          echo "$out"
          ver="$(echo "$out" | sed -n 's/^FOUND //p')"
          state="$(echo "$out" | grep -E '^(TRIGGER|NO-TRIGGER)$' | head -1)"
          sight="$(echo "$out" | grep -E '^(SEEING|BLIND)$' | head -1)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "state=$state"  >> "$GITHUB_OUTPUT"
          echo "sight=$sight"  >> "$GITHUB_OUTPUT"

      # Why this step exists at all: between 2026-10-25 and 2026-10-29 this
      # watcher stopped being able to read the version, and every run since then
      # concluded *success* while printing "FOUND none". It never saw 8.18.0.
      # A watcher that cannot read its source has to say so somewhere a person
      # looks, and nobody reads the log of a green scheduled run.
      #
      # Not a failing job: this fires every 4 hours, so a red run would be six
      # red runs a day and would be muted within a week. One issue, instead.
      - name: Say so when the version can no longer be read
        if: steps.check.outputs.sight == 'BLIND'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="[Škoda] The official-API app watcher can no longer read the app version"
          # De-duplicated on OPEN issues only, and that is deliberately the
          # OPPOSITE of the version-trigger step below. There, a closed issue
          # means "this version was evaluated", so re-filing it would be noise.
          # Here, a closed issue means "the watcher was repaired", so if it goes
          # blind again later that is a NEW fault and must be able to re-file.
          existing="$(gh issue list --state open --search 'in:title can no longer read the app version' --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "already filed and still open — not filing again"
            exit 0
          fi
          gh issue create --title "$title" --label "bug" --body "$(cat <<'EOF'
          The scheduled watcher ran, reached its source, and came back with no
          version at all. It printed `FOUND none` and did not trigger.

          **This is not "no new version".** It means the watcher stopped
          looking, and it cannot tell the difference by itself — which is why
          this issue exists rather than a line in a green run's log.

          What it blocks: nothing automatically, but the key-minting evaluation
          in #1286 depends on noticing a new MyŠkoda release, and while this is
          open nobody is noticing.

          **Known cause as of 2026-11-01:** the Google Play listing no longer
          carries a parseable version slot. The page still contains strings like
          8.16.0 and 8.15.0, but those are review metadata — reading them would
          report a version several releases behind reality as if it were
          current, so the watcher deliberately reports nothing instead.

          Two attempts are made before this is filed, so a single network blip
          does not reach here. If the next run (within 4 hours) recovers,
          closing this is the right action — it will re-file if it goes blind
          again.
          EOF
          )"

      - name: Open tracking issue when the trigger version is out
        if: steps.check.outputs.state == 'TRIGGER'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          title="[Škoda] Official API app reached ${VERSION} — evaluate key-minting"
          # de-dup across ALL states (open OR closed): file at most ONE issue per
          # app version. The old check looked only at OPEN issues, so once a
          # maintainer CLOSED the tracking issue (evaluated + deferred) the next
          # run re-filed a duplicate for the same version (#1341 closed → #1352).
          # A genuinely new version has a different title, so it still files once.
          existing="$(gh issue list --state all --search 'in:title Official API app reached' --json title --jq "[.[] | select(.title | contains(\"reached ${VERSION}\"))] | length")"
          if [ "$existing" != "0" ]; then
            echo "Tracking issue for ${VERSION} already exists (open or closed) — nothing to do."
            exit 0
          fi
          gh issue create --title "$title" --label "enhancement" --body "$(cat <<EOF
          The MyŠkoda app has reached **${VERSION}** on the mirrors — this is the version that ships the official-API key-management screen (Settings → Smart Home → API Keys).

          **Next steps (for a maintainer):**
          1. Pull the new APK and decompile it.
          2. Analyse the key-creation flow (Settings → Smart Home → API Keys): find the backend endpoint the "Create key" action calls.
          3. Decide **auto-mint feasibility**: is that endpoint reachable off-device with an existing session, or attestation-walled? If reachable → wire automatic key-minting into the opt-in Škoda-official channel; if walled → manual key entry stays.
          4. The opt-in channel client + grounded spec already exist (\`custom_components/vag_connect/cariad/api/skoda_official.py\`, \`docs/research/skoda-official-api.md\`).

          _Auto-filed by the Škoda official-API app watch (\`scripts/skoda_official_watch.py\`)._
          EOF
          )"
          echo "Opened tracking issue for ${VERSION}."
