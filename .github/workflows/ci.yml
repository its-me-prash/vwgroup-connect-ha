name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is required by the GPS gate below, which asks what a
      # change ADDS and therefore needs a baseline to diff against. The default
      # shallow checkout has neither history nor origin/main, and the gate is
      # deliberately loud about a missing baseline rather than permissive — so
      # without this it would fail every run instead of passing silently.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Abhängigkeiten installieren
        run: |
          pip install \
            ruff==0.15.12 \
            mypy \
            homeassistant

      # scripts/ is included deliberately, added 2026-11-06 together with the
      # 22 findings it had accumulated. It was never excluded by configuration —
      # there is no ruff config in this repo at all — it was simply never passed
      # in, so nothing looked at 45 files. Cleaning them up without adding them
      # here would have been pointless: the findings were the kind that
      # accumulate one quick probe script at a time, so they would be back.
      # The default rule set is small (E4/E7/E9 plus F), which is why this costs
      # a probe script almost nothing.
      - name: Ruff Lint
        run: ruff check custom_components/ tests/ scripts/

      - name: mypy strict
        run: |
          mypy custom_components/vag_connect/ \
            --ignore-missing-imports \
            --disallow-untyped-defs \
            --disallow-incomplete-defs \
            --warn-return-any \
            --no-error-summary

      # scripts/ gets mypy too, added 2026-11-06, but NOT with the strict flags
      # above — and that difference is measured, not a shrug. With
      # --disallow-untyped-defs/--warn-return-any the 45 probe scripts produce
      # 55 findings, every single one of them no-untyped-def (36) or
      # no-any-return (19): annotation pressure, not one type defect. Without
      # them the count is 0, and the run still catches the classes that matter.
      # It had caught three real defects within the hour it was first run:
      #   * vwde_masterdata_probe.py imported two constants removed from
      #     _website_authproxy on 2026-09-09, so it died on ImportError the
      #     moment main() ran — unnoticed for two months;
      #   * test_vw_ca_connection.py read exc.headers/exc.body off an exception
      #     that carries neither, i.e. AttributeError inside the error handler,
      #     on the failure path only;
      #   * get_idk_token.py declared `-> int` while returning three tokens.
      # Demanding full annotations on throwaway probe scripts would buy nothing
      # on top of that and would get this step deleted the first busy evening.
      - name: mypy auf scripts/
        run: |
          mypy scripts/ \
            --ignore-missing-imports \
            --no-error-summary

      - name: manifest.json validieren
        run: |
          python3 -c "
          import json, sys
          m = json.load(open('custom_components/vag_connect/manifest.json'))
          required = ['domain', 'name', 'version', 'requirements', 'iot_class', 'config_flow']
          missing = [k for k in required if k not in m]
          if missing:
              print('FEHLER: Fehlende Felder:', missing); sys.exit(1)
          # requirements can be empty (we bundle our own client) or contain pypi packages
          print('requirements:', m.get('requirements', []))
          valid_iot = ('cloud_push', 'cloud_polling', 'local_push', 'local_polling')
          if m.get('iot_class') not in valid_iot:
              print('FEHLER: iot_class ungültig:', m.get('iot_class')); sys.exit(1)
          print('iot_class:', m['iot_class'])
          print('manifest.json OK — Version:', m['version'])
          "

      - name: Alle JSON-Dateien validieren
        run: |
          python3 -c "
          import json, os, sys
          errors = []
          for root, _, files in os.walk('custom_components'):
              for f in files:
                  if f.endswith('.json'):
                      p = os.path.join(root, f)
                      try:
                          json.load(open(p))
                          print(f'OK: {p}')
                      except Exception as e:
                          errors.append(f'FEHLER {p}: {e}')
          if errors:
              for e in errors: print(e)
              sys.exit(1)
          "

      # CONTRIBUTING.md forbids full VINs in the repo, fixtures and commits, and
      # it binds maintainers as well as contributors. Runs here rather than only
      # in a git hook, because .git/hooks is not committed and so does not
      # protect a fork PR at all.
      - name: Keine echten VINs im Repo
        run: python3 scripts/check_no_real_vins.py

      # The same rule for coordinates, which CONTRIBUTING.md forbids beyond one
      # decimal. It runs with --base rather than as an audit because the tracked
      # tree holds 13 pairs that are deliberate — public landmarks used as test
      # inputs, named in the script's docstring. An audit run would fail on
      # those every time, and a required check that always fails gets deleted,
      # so this one gates what a change ADDS. Measured before wiring it: replayed
      # over the last 120 main commits against their real parents it would have
      # refused 0 of them, which is the number that decides whether a gate may
      # be required at all.
      #
      # The base differs by event, and that is not cosmetic. On a pull request
      # the merge base with main is the right comparison. On a direct push to
      # main, origin/main IS the new HEAD, so merge-base would return HEAD, the
      # diff would be empty and the gate would pass on anything — a gate that
      # does not gate. The pushed-from commit is the only honest baseline there.
      #
      # Refs go through the environment instead of ${{ }} in the script body:
      # on a fork they are attacker-controlled and would otherwise be spliced
      # straight into the shell.
      - name: Keine präzisen GPS-Koordinaten in neuen Zeilen
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
            if [ -z "$BASE" ] \
               || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              echo "Vorgänger-SHA des Push nicht nutzbar — vergleiche HEAD~1."
              BASE="HEAD~1"
            fi
          else
            BASE="origin/main"
          fi
          echo "Basis: $BASE"
          python3 scripts/check_no_precise_gps.py --base "$BASE"

      - name: CHANGELOG.md enthält aktuelle Version
        run: |
          python3 -c "
          import json, sys
          version = json.load(open('custom_components/vag_connect/manifest.json'))['version']
          changelog = open('CHANGELOG.md').read()
          if f'[{version}]' not in changelog:
              print(f'FEHLER: Version {version} nicht im CHANGELOG.md!')
              sys.exit(1)
          print(f'CHANGELOG.md enthält Version {version} — OK')
          "

  tests:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Python 3.14 einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test-Abhängigkeiten installieren
        run: |
          pip install \
            pytest \
            pytest-cov \
            pytest-asyncio \
            hypothesis \
            voluptuous \
            homeassistant

      - name: Tests mit Coverage ausführen
        id: pytest
        run: |
          set -o pipefail
          # --cov-fail-under below is the single source for the coverage gate.
          # Docs point at this line; never restate the number next to it.
          python3 -m pytest tests/ -v --tb=long \
            --cov=custom_components/vag_connect \
            --cov-report=term-missing \
            --cov-fail-under=75 2>&1 | tee pytest_output.log

      - name: Show pytest output in step summary on failure
        if: failure()
        run: |
          {
            echo "## Pytest failure summary"
            echo ""
            echo '```'
            # Show only the FAILED lines + tracebacks (last ~200 lines usually)
            grep -E "^(FAILED|ERROR|E   |_____|=====|tests/.*::)" pytest_output.log | head -200 || true
            echo '```'
            echo ""
            echo "## Last 100 lines of pytest output"
            echo '```'
            tail -100 pytest_output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pytest log as artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-output
          path: pytest_output.log
          retention-days: 7
          if-no-files-found: ignore

  hassfest:
    name: HA Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # SHA-pinned per supply-chain-hardening (v1.24.1, 2026-05-08).
      # home-assistant/actions has no semver tags — pin to commit SHA.
      # Bump manually when upstream announces breaking changes.
      - uses: "home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6"

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # hacs/action's repo-load phase hits rare transient GitHub API 404s
      # ("Not Found" -> "not loaded properly in HACS", ~1/40 runs) BEFORE any
      # validator runs. Retry absorbs the flake so CI stays deterministically green.
      # NB: hacs/action@22.5.0 internally runs ghcr.io/hacs/action:main (rolling) --
      # the dated tag does NOT pin the validation logic, only this wrapper's inputs do.
      # wretry.action SHA-pinned per supply-chain-hardening (v3.8.0).
      - name: HACS Validation
        uses: Wandalen/wretry.action@e68c23e6309f2871ca8ae4763e7629b9c258e1ea  # v3.8.0
        with:
          action: hacs/action@22.5.0
          with: |
            category: integration
            github_token: ${{ github.token }}
          attempt_limit: 3
          attempt_delay: 15000
