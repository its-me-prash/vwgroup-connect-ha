name: Release

on:
  push:
    tags:
      - "v*"

# Serialise runs for the same tag. A single tag push can occasionally spawn two
# Release runs; without this they race on "Create Release" (one wins, one fails
# 422 already-exists) and the loser can leave the release without its
# vag_connect.zip asset. cancel-in-progress:false lets the second run finish
# after the first and idempotently update the release (softprops re-uploads the
# zip) instead of racing.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Version aus manifest.json lesen
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/vag_connect/manifest.json'))['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Tag mit manifest.json abgleichen
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          MANIFEST="${{ steps.version.outputs.version }}"
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "ERROR: Tag v$TAG != manifest.json $MANIFEST"
            exit 1
          fi

      - name: Release-Notes generieren
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 << 'PYTHON'
          import re, os, sys

          version = os.environ["VERSION"]
          changelog = open("CHANGELOG.md").read()

          # All released versions, newest first, INCLUDING pre-releases. Date is
          # captured from the `## [X.Y.Z] - YYYY-MM-DD` header when present.
          #
          # The pattern used to be plain semver only, which meant a beta's own
          # section could never be found: `## [5.2.3b1]` did not match, `version`
          # was absent from the list, and the body came out degraded. No beta had
          # hit it because the "Release-Notes vollständig?" gate below was added
          # on 2026-10-21 and the previous beta was tagged on 2026-10-04 — so
          # v5.2.3b1 was the first pre-release to run through the gate, and the
          # gate did exactly its job: it refused to let a half-built page pass
          # for a normal one. The tests did not catch it either, because the
          # harness reads headings permissively and then filters its happy path
          # down to plain semver.
          all_entries = re.findall(
              r"## \[(\d+\.\d+\.\d+(?:(?:a|b|rc|pre)\d*)?)\](?:\s*-\s*(\d{4}-\d{2}-\d{2}))?",
              changelog,
          )
          versions_only = [v for v, _ in all_entries]
          idx = versions_only.index(version) if version in versions_only else -1
          # ``prev_version`` and the "Recent releases" pointer stay on STABLE
          # versions, deliberately, and that is what keeps a stable release's
          # notes byte-identical to before this widening. Letting pre-releases
          # into them would have been the easy edit and a silent change to every
          # stable page: betas listed as recent releases, and a comparison link
          # pointing at a beta instead of the previous stable. For a beta page
          # the previous STABLE is also the more useful comparison — "what is new
          # since 5.2.2" — so one rule serves both.
          _is_stable = lambda v: re.fullmatch(r"\d+\.\d+\.\d+", v) is not None  # noqa: E731
          stable = [(v, d) for v, d in all_entries if _is_stable(v)]
          # POSITION-based, as before: the next stable BELOW this release in the
          # file, not merely the newest stable that is not this one. The two are
          # the same when the version being released is the newest section —
          # which it is at tag time — and they differ on a re-run for an older
          # tag. Keeping the position rule means this widening cannot change
          # what such a re-run produces either.
          prev_version = next(
              (v for v, _ in all_entries[idx + 1:] if _is_stable(v)), None
          ) if idx >= 0 else next((v for v, _ in stable if v != version), None)
          # Last 3 prior versions for the "Recent releases" pointer
          recent_prior = [(v, d) for v, d in stable if v != version][:3]

          repo = "its-me-prash/vwgroup-connect-ha"

          lines: list[str] = []

          # ── EN-first headline ────────────────────────────────────────────
          lines.append(f"# VW Group Connect v{version}")
          lines.append("")
          lines.append("Home Assistant integration for Audi · VW · Škoda · SEAT · CUPRA · Porsche · VW US/CA.")
          lines.append("")

          # -- What changed in this release -----------------------------------
          # The SHORT form, one line per change. This step used to paste the
          # version's entire CHANGELOG section verbatim, which for v5.1.0 came
          # to 44 681 characters over 653 lines -- and this body is what Home
          # Assistant shows in its update dialog and HACS in the store
          # listing, so the part a reader needs first was buried under the
          # measurement and reasoning behind each fix.
          #
          # Nothing is maintained twice: build_release_notes derives each line
          # from the entry's own bold title and links CHANGELOG.md for the long
          # form. Its docstring carries the reasoning.
          sys.path.insert(0, "scripts")
          from build_release_notes import build as build_short_notes

          degraded = ""

          try:
              lines.append(build_short_notes(changelog, version))
          except SystemExit as exc:
              # No section for this version, or one with no entries — which
              # happens if a tag is pushed before [Unreleased] is renamed.
              #
              # The release is still published: failing here would leave a
              # pushed, immutable tag with no GitHub Release and no
              # vag_connect.zip, which is worse than a thin body. What changed
              # is that it no longer passes for a normal release. Before, this
              # path printed a ::warning:: nobody reads and a body that looked
              # deliberate — so the tag succeeded, the run stayed green, and
              # every user saw an empty-looking release with nothing saying
              # anything had gone wrong. The body now says so itself, and the
              # "Release-Notes vollständig?" step below turns the run red
              # once the release and the zip exist.
              print(f"::error::release body has no change list: {exc}")
              degraded = "true"
              lines.append("## The change list could not be generated")
              lines.append("")
              lines.append(
                  "**This release page is incomplete.** No `## "
                  f"[{version}]` section with entries was found in "
                  "CHANGELOG.md when these notes were built, so the usual "
                  "one line per change is missing from this page."
              )
              lines.append("")
              lines.append(
                  "The release itself is unaffected — the integration and "
                  "`vag_connect.zip` are exactly as tagged. Everything that "
                  "changed is in the changelog:"
              )
              lines.append("")
              lines.append(
                  f"➜ [CHANGELOG.md → v{version}]"
                  f"(https://github.com/{repo}/blob/v{version}/CHANGELOG.md)"
              )
              lines.append("")
              lines.append(
                  "**Diese Release-Seite ist unvollständig** — die "
                  "Änderungsliste steht im verlinkten Changelog."
              )
          lines.append("")

          # ── Compare against previous version ─────────────────────────────
          if prev_version:
              lines.append(f"## Full diff vs v{prev_version} / Kompletter Diff zu v{prev_version}")
              lines.append("")
              compare_url = f"https://github.com/{repo}/compare/v{prev_version}...v{version}"
              lines.append(f"Every commit, file and code change between the two versions:")
              lines.append(f"Jeder Commit, jede Datei und jede Code-Änderung zwischen beiden Versionen:")
              lines.append("")
              lines.append(f"➜ **{compare_url}**")
              lines.append("")

          # ── Recent releases pointer ──────────────────────────────────────
          if recent_prior:
              lines.append("## Recent releases / Letzte Releases")
              lines.append("")
              lines.append("If you're upgrading from an older version, also read these notes:")
              lines.append("")
              lines.append("Wenn du von einer älteren Version updatest, lies auch diese Release-Notes:")
              lines.append("")
              for v, d in recent_prior:
                  date_part = f" · {d}" if d else ""
                  lines.append(f"- [v{v}](https://github.com/{repo}/releases/tag/v{v}){date_part}")
              lines.append("")
              lines.append(f"Full history: [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md)")
              lines.append("")

          # ── Installation / Update ────────────────────────────────────────
          lines.append("## Installation / Update")
          lines.append("")
          lines.append("**HACS users:** the update notification appears automatically within ~6 hours of the release.")
          lines.append("")
          lines.append("**HACS-User:** Der Update-Hinweis erscheint automatisch innerhalb von ~6 Stunden nach dem Release.")
          lines.append("")
          lines.append("**Manual install / Manuelle Installation:**")
          lines.append("")
          lines.append("1. Download `vag_connect.zip` from this release / `vag_connect.zip` aus diesem Release herunterladen")
          lines.append("2. Unzip and copy `custom_components/vag_connect/` to your HA `config/custom_components/` folder, replacing any older copy / Entpacken und den Ordner `custom_components/vag_connect/` in dein HA `config/custom_components/` kopieren — alten Ordner ersetzen")
          lines.append("3. Restart Home Assistant / Home Assistant neu starten")
          lines.append("")

          # ── Brand support ────────────────────────────────────────────────
          lines.append("## Supported brands / Unterstützte Marken")
          lines.append("")
          lines.append("Volkswagen EU · Audi · Škoda · SEAT · CUPRA · Volkswagen US/CA (Beta) · Porsche (Beta)")
          lines.append("")

          # ── Reporting issues ─────────────────────────────────────────────
          lines.append("## Found a bug? / Bug gefunden?")
          lines.append("")
          lines.append(f"Open an issue with the bug-report template: https://github.com/{repo}/issues/new/choose")
          lines.append("")
          lines.append(f"Bug-Report-Template: https://github.com/{repo}/issues/new/choose")
          lines.append("")
          lines.append("Please mask your VIN to the last 6 characters and remove email/tokens/GPS before posting.")
          lines.append("")
          lines.append("Bitte VIN auf die letzten 6 Zeichen kürzen und Email/Tokens/GPS vor dem Posten entfernen.")

          notes = "\n".join(lines)
          with open("/tmp/release_notes.md", "w") as f:
              f.write(notes)
          print(notes)

          # The flag the verification step reads. Written last, so it reflects
          # a body that was actually assembled and written out rather than a
          # run that died halfway.
          gh_output = os.environ.get("GITHUB_OUTPUT")
          if degraded and gh_output:
              with open(gh_output, "a") as fh:
                  fh.write("degraded=true\n")
          PYTHON

      - name: Integration ZIP bauen
        run: |
          cd custom_components
          zip -r ../vag_connect.zip vag_connect/ \
            -x "**/__pycache__/*" "**/*.pyc" "**/.mypy_cache/*"
          echo "ZIP size: $(du -sh ../vag_connect.zip | cut -f1)"

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: vag_connect.zip
          body_path: /tmp/release_notes.md
          name: "VW Group Connect v${{ steps.version.outputs.version }}"
          draft: false
          # Mark as prerelease for long names (alpha/beta/rc/pre) AND
          # for PEP 440 short markers (vX.Y.ZbN / vX.Y.ZaN / vX.Y.ZrcN).
          # The .{digit}{a|b|rc} substrings catch our canonical pattern
          # of a digit followed by a/b/rc — e.g. '.0b3' or '.0rc1'.
          # Without this, tags like v2.7.0b3 published as non-prerelease
          # and needed a manual gh release edit --prerelease afterwards.
          prerelease: ${{ contains(github.ref_name, 'a') || contains(github.ref_name, 'b') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Deliberately the LAST step, and deliberately not a guard on the ones
      # above it. If the notes step could not build a change list it still
      # publishes the release, because a pushed tag is immutable and a tag
      # with no Release and no vag_connect.zip is worse than a thin body — so
      # by the time this runs, the release and the asset exist and nothing is
      # lost. What this step adds is that the run cannot end green over it.
      #
      # The failure it catches is pushing a tag before [Unreleased] has been
      # renamed to the version (RELEASE_PROCESS.md, step 2). That used to
      # publish a release body with no change list at all, on a green run,
      # with a ::warning:: in the log as the only trace — and the release body
      # is what Home Assistant shows in its update dialog and HACS in the
      # store listing, so everybody saw an empty-looking release and nothing
      # said why.
      - name: Release-Notes vollständig?
        if: always()
        run: |
          if [ "${{ steps.notes.outputs.degraded }}" = "true" ]; then
            echo "::error::Release v${{ steps.version.outputs.version }} was published WITHOUT a change list."
            echo ""
            echo "The release and vag_connect.zip exist and are correct; only this"
            echo "page's summary is missing. The usual cause is tagging before"
            echo "CHANGELOG.md's [Unreleased] heading was renamed to the version."
            echo ""
            echo "To repair it without touching the tag (tags are immutable):"
            echo "  1. rename the [Unreleased] heading to [${{ steps.version.outputs.version }}] on main"
            echo "  2. re-run this workflow, which rewrites the release body in place"
            exit 1
          fi
          echo "Release notes carried their change list."
