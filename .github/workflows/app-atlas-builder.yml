name: App Atlas Builder

# Cross-brand VAG app discovery pipeline. See docs/research/app-atlas/
# README.md for context + LEGAL.md for reverse-engineering disclosure.
#
# Phase A.1 (current): version-polling for all 8 brand builds via Google Play.
#                      Play is the ONLY source — the APK mirrors that used to
#                      sit behind it were removed on 2026-10-17 (they serve
#                      whatever they last ingested, and an unresolvable mirror
#                      host had been failing this workflow daily since the
#                      13th). Porsche ships two packages (NA + rest-of-world);
#                      both are polled, and neither publishes a version on
#                      Play, so both render as a gap.
# Phase A.2:           APK download + apktool extraction + grep. Runs LOCALLY,
#                      not in this job: the APK comes from Google Play via
#                      apkeep, which signs in with a disposable account, and
#                      doing that from a shared runner IP is how those accounts
#                      get locked. This job therefore polls versions only. Run
#                      extraction by hand:
#                        python scripts/app_atlas/build_atlas.py
#                          --with-apk-extraction [--force-extract]
# Phase A.3 (later):   jadx decompile + cross-version semantic diff (also local).
#
# Runs daily at 04:00 UTC (different from the upstream-ola-watcher's
# 08:00 UTC so the two don't compete for runner availability).
#
# When the version-name changes for a brand, this workflow:
#   1. Updates docs/research/app-atlas/{brand}.md
#   2. Updates the cross-brand summary
#   3. Auto-commits to a branch named auto/atlas-{date}
#   4. Opens a PR for human review (no auto-merge — same safety pattern
#      as the OLA watcher, in case the store listing returned junk data)
#
# Idempotent: re-runs without version changes are no-ops.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run atlas builder (Phase A.1 version polling)
        # Version polling only — see the Phase A.2 note in the header for why
        # APK extraction is not run here. Reads eight Google Play listings, so
        # this stays well under a minute.
        #
        # The notice is the point of this step's own annotation: what this job
        # does and what it does not do differ, and a green tick alone does not
        # say which. Someone reading the run has to be able to tell that the
        # APK findings on the atlas pages were not re-checked here, without
        # going to read this file.
        run: |
          echo "::notice title=App Atlas::Version polling only — no APK was fetched or extracted in this run. Phases A.2/A.3 run locally (see docs/research/app-atlas/README.md), so the extraction findings on the atlas pages are whatever the last local run committed."
          python scripts/app_atlas/build_atlas.py

      - name: Diff client_ids vs source (v2.10.4 watcher)
        # Reads .app-atlas-apk-cache, which is gitignored and written only by an
        # extraction run — so in this job it finds nothing and reports nothing
        # (the script returns early when the directory is absent, so it cannot
        # raise either).
        #
        # Detection itself did not move away with extraction: build_atlas.py
        # invokes this same script at the end of a --with-apk-extraction run,
        # where the cache exists. Delivery is the half that is NOT covered: the
        # issue-filing step below reads a marker file that only exists next to
        # a cache written in this job, so a client_id found locally does not
        # reach the tracker on its own — the local run prints a warning telling
        # the maintainer to file it. Both steps stay so the wiring is already
        # here if extraction returns to CI, and so that closing the delivery
        # gap is a change in one place rather than a new mechanism.
        id: client_id_diff
        run: |
          python scripts/app_atlas/diff_known_client_ids.py
          if [ -f .app-atlas-apk-cache/new-client-ids-found.md ]; then
            echo "new_ids=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_ids=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open issue for new client_ids
        if: steps.client_id_diff.outputs.new_ids == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          # De-dupe against an already-open issue from a previous run.
          EXISTING=$(gh issue list --state open --label apk-watcher --search 'in:title "new OAuth client_id"' --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already tracks new client_ids - adding comment."
            gh issue comment "$EXISTING" --body-file .app-atlas-apk-cache/new-client-ids-found.md
          else
            gh issue create \
              --title "apk-watcher: new OAuth client_id detected (${DATE})" \
              --label apk-watcher \
              --body-file .app-atlas-apk-cache/new-client-ids-found.md
          fi

      - name: Detect changes
        id: changes
        run: |
          # Compare the VERSIONS, not the file bytes.
          #
          # The status travels with the version on purpose. A run that keeps
          # the previous version because every source failed, or because a
          # source offered an older reading, does NOT move last_version_name —
          # so comparing versions alone would call that "no change" and the
          # `git checkout --` below would throw the explanation away. Comparing
          # the pair means the flip into (and back out of) those states is what
          # opens the PR, rather than every single run in that state.
          # This used to be a plain `git diff --quiet` over the cache + docs.
          # But `last_checked_at` is rewritten on every single run, so the diff
          # was never empty, "changed" was always true, and the no-change branch
          # below could never fire. The watcher therefore opened a PR every time
          # it looked — carrying nothing but timestamps, under a title and body
          # announcing "version changes detected" and asking the maintainer to
          # scan the diff for jumps that weren't there (#727 was exactly this).
          python - <<'PY' > /tmp/atlas_after.txt
          import json
          b = json.load(open(".app-atlas-cache.json", encoding="utf-8"))["brands"]
          for k in sorted(b):
              print(f'{k}={b[k].get("last_version_name")}|{b[k].get("last_status", "ok")}')
          PY
          git show HEAD:.app-atlas-cache.json > /tmp/atlas_head.json 2>/dev/null || echo '{"brands":{}}' > /tmp/atlas_head.json
          python - <<'PY' > /tmp/atlas_before.txt
          import json
          b = json.load(open("/tmp/atlas_head.json", encoding="utf-8")).get("brands", {})
          for k in sorted(b):
              print(f'{k}={b[k].get("last_version_name")}|{b[k].get("last_status", "ok")}')
          PY
          if diff -q /tmp/atlas_before.txt /tmp/atlas_after.txt >/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "✅ No version changes — only the check timestamp moved. Nothing to open a PR for."
            git checkout -- '.app-atlas-cache.json' 'docs/research/app-atlas/' 2>/dev/null || true
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "📝 Version changes detected:"
            diff /tmp/atlas_before.txt /tmp/atlas_after.txt || true
          fi

      - name: Check for existing auto-PR (idempotency)
        id: existing
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Avoid spamming duplicate PRs while a previous one is still
          # open. Title-prefix match.
          EXISTING=$(gh pr list --state open --search 'in:title "chore(atlas): refresh"' --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open — adding a comment instead."
            gh pr comment "$EXISTING" --body "Auto-watcher re-detected atlas changes on $(date -u +%Y-%m-%d). Force-pushing the refreshed version onto the same branch is risky, so this is just a reminder — please review + merge to clear the cycle."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open Pull Request
        if: steps.changes.outputs.changed == 'true' && steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "vw-group-connect-bot"
          git config user.email "noreply@github.com"
          DATE=$(date -u +%Y%m%d)
          BRANCH="auto/atlas-${DATE}"
          git checkout -b "$BRANCH"

          git add .app-atlas-cache.json docs/research/app-atlas/
          git commit -m "chore(atlas): refresh app-atlas via daily watcher

          Auto-generated by .github/workflows/app-atlas-builder.yml.
          Phase A.1: version-polling only (no APK extraction yet).

          This PR only exists because a version-name actually moved —
          the check timestamp alone no longer opens one.

          Maintainer review: scan the diff for implausible jumps (e.g.
          SEAT going from 2.17.0 to 0.0.1 would suggest a source
          returned junk — close PR + investigate). Otherwise just merge."

          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore(atlas): refresh app-atlas via daily watcher ($(date -u +%Y-%m-%d))" \
            --label "auto-atlas" \
            --body "A brand app's version-name changed. Google Play is the only source polled.

          See \`docs/research/app-atlas/_summary.md\` for the cross-brand matrix
          and the per-brand \`{brand}.md\` files for details.

          **Scope**: this PR only updates version-name tracking. APK download
          and extraction (Phase A.2) run locally, not in CI, so the deeper
          findings on the atlas pages are whatever the last local run
          committed.

          **Maintainer review**: scan the diff for implausible jumps
          (e.g. a version going backward, or from \`5.4.1\` to something
          like \`0.0.1\`, suggesting a source returned junk). Otherwise
          just merge.

          _Auto-filed by \`.github/workflows/app-atlas-builder.yml\` on $(date -u +%Y-%m-%d). Idempotent — won't re-create this PR while it's open._"

      - name: Summary report
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "✅ App Atlas in sync — no PR needed."
          echo ""
          cat docs/research/app-atlas/_summary.md
