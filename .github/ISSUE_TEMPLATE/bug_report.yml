name: 🐛 Bug Report
description: Something doesn't work as expected / Etwas funktioniert nicht wie erwartet
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the feedback! Please fill in as many fields as possible — it saves a lot of time.

        Danke für dein Feedback! Bitte fülle so viele Felder wie möglich aus — das spart enorm Zeit.

  - type: dropdown
    id: brand
    attributes:
      label: Vehicle brand / Fahrzeugmarke
      options:
        - Audi
        - Volkswagen EU
        - Škoda
        - SEAT
        - CUPRA
        - Volkswagen US/CA
        - Porsche
    validations:
      required: true

  - type: input
    id: country
    attributes:
      label: Country / Land
      placeholder: "e.g. Germany, Austria, UK, USA"
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: Model + year / Modell + Baujahr
      placeholder: "e.g. Audi S6 2021, ID.4 2023, Cupra Born 2023"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: VW Group Connect Version
      placeholder: "e.g. 1.8.0"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant Version
      placeholder: "e.g. 2026.4.0"
    validations:
      required: true

  - type: dropdown
    id: official_app
    attributes:
      label: Does the same action work in the official manufacturer app? / Funktioniert die selbe Aktion in der offiziellen App?
      options:
        - "Yes / Ja"
        - "No / Nein"
        - "Partially / Teilweise"
        - "I don't know / Weiß ich nicht"
    validations:
      required: true

  - type: dropdown
    id: subscription
    attributes:
      label: Connected services subscription active? / Online-Services Abo aktiv?
      description: |
        Some brands (VW, CUPRA) block commands when the subscription expires —
        that's not a bug in this integration but a server-side restriction.

        Manche Marken (VW, CUPRA) sperren Befehle wenn das Abo abgelaufen ist —
        dann ist es kein Bug bei uns sondern eine serverseitige Einschränkung.
      options:
        - "Yes / Ja"
        - "No / Nein"
        - "I don't know / Weiß ich nicht"
    validations:
      required: true

  - type: dropdown
    id: spin
    attributes:
      label: S-PIN configured? / S-PIN konfiguriert?
      description: S-PIN is required for lock and some other commands / S-PIN ist nötig für Verriegeln und einige andere Befehle
      options:
        - "Yes / Ja"
        - "No / Nein"
        - "Not relevant / Nicht relevant"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened? / Was ist passiert?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should happen? / Was sollte passieren?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (redacted / geschwärzt)
      description: |
        HA → Settings → System → Logs → filter by "vag_connect".
        Enable debug logging via the integration → "Enable debug logging".

        HA → Einstellungen → System → Logs → nach "vag_connect" filtern.
        Debug-Logging über Integration → Debug-Logging aktivieren.

        **Privacy — required masking before posting:**
        - **VIN** → keep only last 6 chars (e.g. `***003577`). A full VIN ties to registration, insurance and ownership records.
        - **Email** → mask local part, e.g. `u***@***.com`
        - **Tokens** (`access_token`, `refresh_token`, `id_token`) → remove completely
        - **GPS** (`latitude`, `longitude`) → round to 1 decimal or remove
        - **S-PIN** → never share, even masked
        - **Account ID / user_id** → remove

        **Datenschutz — vor dem Posten Pflicht:**
        - **VIN** nur letzte 6 Zeichen (z.B. `***003577`). Eine vollständige VIN ist mit Zulassung, Versicherung und Eigentümerdaten verknüpft.
        - **Email** lokalen Teil schwärzen, z.B. `u***@***.com`
        - **Tokens** (`access_token`, `refresh_token`, `id_token`) komplett entfernen
        - **GPS** (`latitude`, `longitude`) auf 1 Nachkommastelle runden oder löschen
        - **S-PIN** nie teilen, auch nicht geschwärzt
        - **Account ID / user_id** entfernen
      render: text

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / Diagnose-Daten (optional)
      description: |
        Settings → Devices & Services → VW Group Connect → ⋮ → Download diagnostics.
        **Update to 5.2.2 or newer first.** VIN, password, S-PIN, email, address and user_id
        have been redacted since v1.8.x. Session cookies and account tokens only since 5.2.1, and
        two GPS cases only since 5.2.2: the location of a charging profile, and any field whose
        name is dotted. A file taken on an older version can carry a live volkswagen.de session,
        or the place where you charge. See #1968 if you have already posted one.

        HA → Einstellungen → Integrationen → VW Group Connect → 3-Punkte-Menü → Diagnose herunterladen.
        **Bitte zuerst auf 5.2.2 oder neuer aktualisieren.** VIN, Passwort, S-PIN, Email,
        Adresse und user_id werden seit v1.8.x geschwärzt. Session-Cookies und Konto-Tokens erst
        seit 5.2.1, und zwei GPS-Fälle erst seit 5.2.2: der Ort eines Ladeprofils, und jedes Feld
        mit einem Punkt im Namen. Eine Datei von einer älteren Version kann eine aktive
        volkswagen.de-Sitzung enthalten oder den Ort, an dem du lädst. Falls du schon eine
        gepostet hast: siehe #1968.

        If you cannot update: please do not attach the whole file. Say so in the report instead and
        you will be asked for the one section that is needed. A cookie jar is an opaque string, so
        there is no realistic way to scrub it by hand.
        Wenn du nicht aktualisieren kannst: bitte die Datei NICHT komplett anhängen. Schreib es in
        den Report, dann wird nach dem einen benötigten Abschnitt gefragt. Ein Cookie-Glas ist eine
        opake Zeichenkette — von Hand sauber zu schwärzen ist praktisch nicht möglich.
      render: json

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation / Datenschutz-Bestätigung
      description: Required / Pflicht
      options:
        - label: "My diagnostics file is from 5.2.2 or newer, or I opened it and checked it by hand; and I have masked VIN to last 6 chars and removed email, GPS and S-PIN from any logs I pasted. / Meine Diagnose-Datei ist von 5.2.2 oder neuer, oder ich habe sie geöffnet und von Hand geprüft; und ich habe in eingefügten Logs die VIN auf die letzten 6 Zeichen gekürzt und Email, GPS und S-PIN entfernt."
          required: true
