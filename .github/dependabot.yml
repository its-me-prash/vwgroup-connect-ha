# Dependabot configuration for VW Group Connect.
# The three Python runtime deps (firebase-messaging, aiomqtt, adb-shell)
# are for opt-in push/companion features and are version-managed by hand
# (adb-shell is pinned), so the ecosystem worth auto-watching here is
# GitHub Actions itself — to catch Node version deprecations before they
# break CI.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "ci"
      - "dependencies"
    # Group all action bumps into a single PR so reviews stay light.
    groups:
      github-actions:
        patterns:
          - "*"
