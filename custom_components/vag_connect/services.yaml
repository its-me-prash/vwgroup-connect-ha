# v2.0.0 (Big-Bang) — POI charging-station lookup via Cariad-BFF.
# Returns up to ``max_results`` station dicts within ``radius_m`` metres.
# Service uses response-variable (HA 2024.4+) so callers receive the
# list directly. Backed by ``GET /charging-stations/v1/locations``.
find_charging_stations:
  name: Ladestationen suchen (POI Lookup)
  description: >-
    Sucht Ladestationen rund um den angegebenen Standort über die
    Cariad-BFF POI-API (nur Audi + VW EU). Rückgabe per
    ``response_variable`` als Liste mit Stations-Details (id, name,
    address, location, operator, maxPowerInKW, connectorTypes,
    availability). Beispiel: ``action: vag_connect.find_charging_stations``
    mit ``data: {vin: WAUZZZ..., latitude: 47.3769, longitude: 8.5417,
    radius_m: 5000, max_results: 25}`` und ``response_variable: result``.
  fields:
    vin:
      name: VIN
      description: VIN aus dem Konto. Bestimmt welche Cariad-BFF-Session den Lookup ausführt.
      required: true
      selector:
        text:
    latitude:
      name: Breitengrad
      description: Breitengrad in Dezimalgraden (-90 bis 90).
      required: true
      selector:
        text:
    longitude:
      name: Längengrad
      description: Längengrad in Dezimalgraden (-180 bis 180).
      required: true
      selector:
        text:
    radius_m:
      name: Suchradius (Meter)
      description: Optional. Standard 5000 m (5 km). Max 100 km.
      required: false
      default: 5000
      selector:
        number:
          min: 100
          max: 100000
          step: 100
          unit_of_measurement: m
    max_results:
      name: Max. Ergebnisse
      description: Optional. Standard 25 — bis zu 100 möglich.
      required: false
      default: 25
      selector:
        number:
          min: 1
          max: 100
          step: 1

# v2.8.0 quick-win B — open the brand's native mobile app via deeplink.
# This service does NOT open anything itself; it fires the event
# ``vag_connect_open_app`` on the HA bus with payload
# ``{vin, brand, deeplink_url, action}``. A Lovelace card subscribes
# to that event and navigates ``window.location.href = deeplink_url``
# on the calling device (iOS or Android). The brand and full deeplink
# URL are resolved by the integration from ``DEEPLINK_SCHEMES`` in
# ``const.py``.
open_app:
  name: Open native brand app (deeplink)
  description: >-
    Fires the ``vag_connect_open_app`` event with the fields
    ``vin``, ``brand``, ``deeplink_url`` and ``action`` so a dashboard
    card can open the brand's native mobile app (myAudi, WeConnect,
    MyŠkoda, MySEAT, MyCUPRA, My Porsche or VW US) on the calling
    device. The integration itself cannot open URLs on a phone; the
    dashboard card is responsible for ``window.location.href`` on
    iOS / Android.
  fields:
    vin:
      name: VIN
      description: VIN of the vehicle whose brand-app should open.
      required: true
      example: "WVWZZZ00000000000"
      selector:
        text:
    action:
      name: App action
      description: >-
        Optional. Path segment appended to the deeplink so the brand
        app can route directly to a section. Default ``open`` opens
        the app to its home screen.
      required: false
      default: open
      selector:
        select:
          options:
            - open
            - lock
            - unlock
            - climate_on
            - climate_off
            - charging

# v2.10.0. Rich climate-start. Per-seat heating, glass heating,
# climatisation mode, at-unlock behaviour. Applies to Audi + VW EU
# (CARIAD BFF); other brands fall through to the basic
# ``start_climatisation`` service because the OLA / mysmob / PPA
# backends reject the extra payload fields.
start_climate_control:
  name: Start Climate Control (Rich)
  description: >-
    Start pre-conditioning with individual seat heaters, glass heating,
    climate mode and at-unlock behaviour. Only applies to Audi and VW
    EU (CARIAD BFF) - other brands fall through to the basic
    start_climatisation service. All payload fields except device_id
    are optional - omitted fields keep the brand default.
  fields:
    device_id:
      name: Vehicle
      required: true
      selector:
        device:
          integration: vag_connect
    temp_c:
      name: Target temperature (C)
      selector:
        number:
          min: 15
          max: 30
          step: 0.5
          unit_of_measurement: "C"
    glass_heating:
      name: Glass heating
      selector: {boolean: {}}
    seat_fl:
      name: Front-left seat heating
      selector: {boolean: {}}
    seat_fr:
      name: Front-right seat heating
      selector: {boolean: {}}
    seat_rl:
      name: Rear-left seat heating
      selector: {boolean: {}}
    seat_rr:
      name: Rear-right seat heating
      selector: {boolean: {}}
    climatisation_at_unlock:
      name: Continue climate when unlocked
      selector: {boolean: {}}
    climatisation_mode:
      name: Climatisation mode
      selector:
        select:
          options:
            - comfort
            - economy

# v2.15.5 — push the vehicle's current telemetry to A Better Routeplanner
# (iternio /tlm/send). Target by device or VIN. The api_key + token are
# read from the integration options (ABRP section) when omitted here; pass
# them inline only if you prefer to keep them in the automation. Neither is
# ever written to the log. On success the "ABRP data changed" binary sensor
# resets so the shipped blueprint won't re-upload the same snapshot.
abrp_send:
  name: Send telemetry to ABRP
  description: >-
    Build and POST the targeted vehicle's current telemetry (SoC, GPS,
    charging state, range, temperatures, odometer) to A Better Routeplanner.
    The developer api_key and the per-vehicle ABRP token are taken from the
    integration options unless supplied here. This sends GPS off-device — it
    only runs when you call it (or via the shipped blueprint).
  fields:
    device_id:
      name: Vehicle
      description: The vehicle device to upload. Either this or vin is required.
      required: false
      selector:
        device:
          integration: vag_connect
    vin:
      name: VIN
      description: VIN of the vehicle. Alternative to device_id.
      required: false
      example: "WVWZZZ00000000000"
      selector:
        text:
    api_key:
      name: ABRP api_key (optional override)
      description: >-
        Developer/partner key from iternio. Leave empty to use the key stored
        in the integration options. Never logged.
      required: false
      selector:
        text:
    token:
      name: ABRP token (optional override)
      description: >-
        Per-vehicle "Generic" token from the ABRP app (Settings → car → Live
        Data). Leave empty to use the token stored in the integration
        options. Never logged.
      required: false
      selector:
        text:

# v2.10.0 Group B - SEAT/CUPRA settable charge plan.
# Maps to POST /v1/vehicles/{vin}/charging/actions/update-settings.
# At least one of the optional fields must be provided; an empty body
# is rejected with a ServiceValidationError. Other brands ignore the
# service (MISSING_CAPABILITY classification at the coordinator level).
update_charging_settings:
  name: Update Charging Settings (SEAT/CUPRA)
  description: >-
    Update the SEAT/CUPRA charge plan in one call. Sets any combination
    of target state of charge, maximum AC charge current and the
    auto-unlock-when-charged flag. Backed by the OLA endpoint
    POST /v1/vehicles/{vin}/charging/actions/update-settings. Other
    brands are rejected at the coordinator dispatch level.
  fields:
    vin:
      name: VIN
      required: true
      selector:
        text:
    target_soc:
      name: Target state of charge (%)
      description: Target state of charge between 20 and 100 percent.
      required: false
      selector:
        number:
          min: 20
          max: 100
          step: 5
          unit_of_measurement: "%"
    max_charge_current:
      name: Maximum AC charge current
      description: Backend enum, ``maximum`` or ``reduced``.
      required: false
      selector:
        select:
          options:
            - maximum
            - reduced
    auto_unlock_charge:
      name: Auto-unlock plug when fully charged
      description: When true the connector unlocks itself once charging is complete.
      required: false
      selector:
        boolean: {}
