set_climatisation_temperature:
  name: Klimatemperatur setzen
  description: Setzt die Zieltemperatur der Vorklimatisierung.
  fields:
    vin:
      name: VIN
      required: true
      selector:
        text:
    temperature:
      name: Temperatur (°C)
      required: true
      selector:
        number:
          min: 16
          max: 30
          step: 0.5
          unit_of_measurement: "°C"

set_departure_timer:
  name: Abfahrtstimer setzen
  description: Aktiviert, deaktiviert oder setzt die Abfahrtszeit eines Departure Timers (1–3). Nur bei EVs und PHEVs mit CARIAD-Backend (Audi, VW, Škoda, SEAT/CUPRA).
  fields:
    vin:
      name: VIN
      required: true
      selector:
        text:
    timer_id:
      name: Timer-Nummer
      description: Welcher Timer (1, 2 oder 3).
      required: true
      selector:
        number:
          min: 1
          max: 3
          step: 1
    enabled:
      name: Aktiviert
      description: Timer ein- oder ausschalten.
      required: true
      selector:
        boolean:
    departure_time:
      name: Abfahrtszeit
      description: Optional. "HH:MM" (z.B. "07:30") oder ISO-Datetime. Leer lassen um nur enabled zu ändern.
      required: false
      selector:
        text:
    recurring_on:
      name: Wochentage (Weekly Preheat)
      description: >-
        v2.0.0 [NEW v2.0] Optional. Liste der Wochentage für wöchentliches
        Vorklimatisieren (z.B. ["MONDAY","TUESDAY","WEDNESDAY","THURSDAY",
        "FRIDAY"]). Wenn gesetzt, schaltet der Timer auf wiederkehrend
        und feuert an jedem genannten Tag. Akzeptiert MONDAY–SUNDAY in
