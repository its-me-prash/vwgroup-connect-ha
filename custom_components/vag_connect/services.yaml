# v2.10.0 unified action dispatcher. One service with a dropdown
# instead of N separate services. Pattern observed in
# arjenvrh/audi_connect_ha v2.1.0 (single ``execute_vehicle_action``
# with an ``action`` select). All per-action services below
# (lock, unlock, start_climatisation, ...) keep working unchanged so
# existing automations are NOT broken; this service is purely an
# easier-to-find UX surface in the Lovelace service picker.
execute_vehicle_action:
  name: Execute Vehicle Action
  description: >-
    Unified service that dispatches a vehicle action selected from a
    dropdown. Equivalent to calling the per-action service of the
    same name but easier to find in the Home Assistant Lovelace
    "service" picker. All existing per-action services (vag_connect.lock,
    vag_connect.start_climatisation, etc) keep working unchanged.
  fields:
    device_id:
      name: Vehicle
      description: The vehicle device to act on.
      required: true
      selector:
        device:
          integration: vag_connect
    action:
      name: Action
      description: Which action to dispatch.
      required: true
      selector:
        select:
          translation_key: execute_vehicle_action_options
          options:
            - lock
            - unlock
            - start_climatisation
            - stop_climatisation
            - start_charging
            - stop_charging
            - flash_lights
            - start_window_heating
            - stop_window_heating
            - wake_vehicle
            - start_aux_heating
            - stop_aux_heating
            - start_ventilation
            - stop_ventilation

# v2.2.3 — Community easter-egg. Spawned by humorous FB-thread
# pointing out "VAG" reads differently in English (Si Gregory + Ben
# Johnson + Evets David + Stuart McBride + Jordan Waeles' Pandas-style
# show_vag() joke). Creates a persistent_notification with the credits
# + list of currently connected vehicles. No vehicle target — account
# level.
show_vag:
  name: "🥚 show_vag() — Community Easter Egg"
  description: >-
    Erstellt eine persistente Benachrichtigung mit den Credits der
    Community-Mitglieder, die die VAG → VW Group Umbenennung angestoßen
    haben (HA UK + HA Ideas Facebook-Gruppen, 2026-05). Inkludiert eine
    Liste aller aktuell verbundenen Fahrzeuge. — Creates a persistent
    notification crediting the community members who triggered the
    rename discussion, plus a list of all currently connected vehicles.
  fields: {}

refresh_vehicle:
  name: Fahrzeugdaten aktualisieren (Cloud-Cache)
  description: >-
    Pollt den Hersteller-Server für die zwischengespeicherten Fahrzeugdaten
    aller Fahrzeuge dieses Kontos. Weckt das Auto NICHT auf — die Daten
    sind so aktuell wie der letzte Server-Sync. Verwende stattdessen
    "Auto wecken" wenn du eine frische Live-Messung vom Auto willst
    (zählt aufs tägliche Wakeup-Budget).
  fields: {}

# v1.13.0 (#63 Phase 3) — semantic-clear alias for refresh_vehicle.
# Same behaviour, but the name makes the cloud-cache-only nature
# explicit. Old name stays active for backwards-compat.
refresh_cloud_cache:
  name: Cloud-Cache aktualisieren (kein Wakeup)
  description: >-
    Identisch zu "refresh_vehicle" — pollt nur den Server-Cache, weckt
    das Auto NICHT auf. Empfohlener neuer Name ab v1.13.0 für klarere
    Semantik (refresh_vehicle bleibt funktionsfähig).
  fields: {}

